kind = "video"
videoAspectRatio = "16:9"
previewPath = "/miyar-competition-demo/"
title = "MIYAR Competition Demo"
description = "A 16:9 Arabic RTL product demonstration film for the MIYAR Islamic-content verification platform, synchronized to the supplied Arabic voiceover and grounded in the actual MIYAR application interface."
version = "1.0.0"
id = "artifacts/miyar-competition-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/miyar-competition-demo/" ]
localPort = 18143

[services.development]
run = "pnpm --filter @workspace/miyar-competition-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/miyar-competition-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/miyar-competition-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18143"
BASE_PATH = "/miyar-competition-demo/"
